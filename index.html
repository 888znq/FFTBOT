<script>
/* canvas helpers shared by the grid + tick charts */
window._pillPath = function (c, x, y, w, h, rr) { var r = Math.max(0, Math.min(Math.abs(w), Math.abs(h)) / 2); if (rr !== undefined) { r = Math.max(0, Math.min(r, rr)); } c.beginPath(); if (c.roundRect) { c.roundRect(x, y, w, h, r); } else { var x2 = x + w, y2 = y + h; c.moveTo(x + r, y); c.arcTo(x2, y, x2, y2, r); c.arcTo(x2, y2, x, y2, r); c.arcTo(x, y2, x, y, r); c.arcTo(x, y, x2, y, r); c.closePath(); } };
window._pillFill = function (c, x, y, w, h, rr) { window._pillPath(c, x, y, w, h, rr); c.fill(); c.beginPath(); };
window._pillStroke = function (c, x, y, w, h, rr) { window._pillPath(c, x, y, w, h, rr); c.stroke(); c.beginPath(); };
window.CHART_BG = (getComputedStyle(document.documentElement).getPropertyValue('--chart-bg') || '').trim() || '#000432';
</script>
<script>
/* pair colour -> --pair-color / html.pc-on (picked up by the CSS) */
window._pcLast = '';
window._pcApply = function () {
    var p;
    try { p = activePair; } catch (e) { return; }
    if (!p || p === window._pcLast) return;
    var col = '';
    try { col = window._tcPairColorFn ? window._tcPairColorFn(p) : ''; } catch (e2) { col = ''; }
    if (!col) { var h = 0, i; for (i = 0; i < p.length; i++) { h = (h * 31 + p.charCodeAt(i)) % 360; } col = 'hsl(' + h + ',80%,62%)'; }
    window._pcLast = p;
    window.pairColorHex = col;
    document.documentElement.style.setProperty('--pair-color', col);
    document.documentElement.classList.add('pc-on');
    try { if (typeof requestDraw === 'function') requestDraw(); } catch (e3) {}
};
setInterval(window._pcApply, 250);
window._pcPaintAll = function () {
    var c = window.pairColorHex, root = document.documentElement;
    if (!c) return;
    if (!window.realGreenHex) {
        window.realGreenHex = (getComputedStyle(root).getPropertyValue('--accent-green') || '').trim() || '#2ED573';
        window.realRedHex = (getComputedStyle(root).getPropertyValue('--accent-red') || '').trim() || '#E63946';
    }
    root.style.setProperty('--real-green', window.realGreenHex);
    root.style.setProperty('--real-red', window.realRedHex);
    if (window._pcPainted === c && window.accentGreenHex === c && window.accentRedHex === c) return;
    window._pcPainted = c;
    root.style.setProperty('--accent-green', c, 'important');
    root.style.setProperty('--accent-red', c, 'important');
    window.accentGreenHex = c;
    window.accentRedHex = c;
    try { if (typeof requestDraw === 'function') requestDraw(); } catch (e) {}
};
setInterval(window._pcPaintAll, 200);
</script>

</div>

<script>
/* move stake / expiry / buy / sell / balance into one floating pill (docked into the tick chart by tickchart.js) */
(function () {
    function mv() {
        var f = document.getElementById('floatTradePill');
        if (f && f.getAttribute('data-ready')) return;
        var sell = document.getElementById('sellBtn'), buy = document.getElementById('buyBtn');
        var amt = document.getElementById('tradeAmount'), exp = document.getElementById('tradeExpiryVisible');
        var bal = document.getElementById('accountBalance');
        if (!sell || !buy || !amt || !exp || !bal) return;
        if (!f) { f = document.createElement('div'); f.id = 'floatTradePill'; document.body.appendChild(f); }
        var items = [amt.parentNode, exp.parentNode, sell, buy, bal, document.getElementById('tradeHistBtn'), document.getElementById('logBtn')], parents = [];
        items.forEach(function (el) {
            if (el.parentNode && el.parentNode !== f && parents.indexOf(el.parentNode) < 0) parents.push(el.parentNode);
            f.appendChild(el);
        });
        parents.forEach(function (p) { if (p.id !== 'trade-console' && p.children.length === 0) p.style.display = 'none'; });
        f.setAttribute('data-ready', '1');
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mv); else mv();
    window.addEventListener('load', mv);
})();
/* html[data-sig] = direction of the selected signal (BUY green / SELL red pill) */
(function () {
    var last = '';
    function dir() {
        var id = '';
        try { id = (typeof lastClickedSigId !== 'undefined') ? lastClickedSigId : ''; } catch (e) { id = ''; }
        if (!id) return '';
        var p = String(id).split('-');
        if (p.length < 3) return '';
        var type = p[p.length - 1], col = p[p.length - 2];
        var up = (type === 'REV') ? (col === 'R') : (col === 'G');
        return up ? 'G' : 'R';
    }
    function paint() {
        var d = dir();
        if (d === last) return;
        last = d;
        if (d) document.documentElement.setAttribute('data-sig', d); else document.documentElement.removeAttribute('data-sig');
    }
    setInterval(paint, 200);
    paint();
})();
</script>
<script src="/static/ui.js?v=__V__"></script>
<script src="/static/tickchart.js?v=__V__"></script>
